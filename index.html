    <title>Lizzdo Media — Creative & Digital Agency</title>
    <meta name="description" content="We help brands stand out and grow with creative design, powerful websites, and result-driven digital solutions." />
    <meta property="og:title" content="Lizzdo Media — Creative & Digital Agency" />
    <meta property="og:description" content="Design. Build. Grow. Together. Leading creative agency specializing in brand identity, graphic design, web development, and digital marketing." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/uploads/lizzdo-media-mark.svg" />
    <script type="text/javascript">
      // GitHub Pages SPA redirect receiver
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#090a0f] text-slate-100 antialiased font-sans selection:bg-[#ffbe1a] selection:text-black overflow-x-hidden min-h-screen">

    <script type="module" src="/src/main.tsx"></script>
  </body>
