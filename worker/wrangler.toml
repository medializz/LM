# =============================================================================
# CLOUDFLARE WORKER CONFIGURATION — LIZZDO MEDIA CMS AUTHENTICATION
# =============================================================================
name = "media-lizzdo-auth"
main = "src/index.ts"
compatibility_date = "2024-10-01"
workers_dev = true

# Non-sensitive configuration variables
[vars]
OAUTH_BASE_URL = "https://media-lizzdo-auth.lets3do.workers.dev"
CMS_ORIGIN = "https://media.lizzdo.com"
GITHUB_CLIENT_ID = "YOUR_GITHUB_CLIENT_ID"

# Optional: Restrict CMS access to specific GitHub usernames (comma-separated).
# If left empty, any GitHub user with write permissions to the repository can authenticate.
ALLOWED_USERS = ""

# =============================================================================
# PRODUCTION SECRETS (DO NOT COMMIT ACTUAL VALUES IN THIS FILE)
# =============================================================================
# Set production secrets via Cloudflare Dashboard or Wrangler CLI:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET
#
# For local testing, add them to .dev.vars (which is ignored in .gitignore)
