<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242838" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Floating Social Post Cards in Background -->
  <g transform="rotate(-12 110 90)" filter="url(#shadowP)">
    <rect x="50" y="45" width="80" height="95" rx="10" fill="#141724" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <rect x="58" y="53" width="64" height="50" rx="6" fill="#ffbe1a" fill-opacity="0.15" />
    <circle cx="90" cy="78" r="14" fill="#ffbe1a" fill-opacity="0.6" />
    <line x1="58" y1="112" x2="95" y2="112" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    <line x1="58" y1="122" x2="110" y2="122" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  </g>

  <g transform="rotate(10 210 90)" filter="url(#shadowP)">
    <rect x="190" y="45" width="80" height="95" rx="10" fill="#141724" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <rect x="198" y="53" width="64" height="50" rx="6" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="230" cy="78" r="14" fill="#38bdf8" fill-opacity="0.6" />
    <line x1="198" y1="112" x2="235" y2="112" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    <line x1="198" y1="122" x2="250" y2="122" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  </g>

  <!-- Hero Center Smartphone -->
  <g filter="url(#shadowP)">
    <!-- Phone Chassis -->
    <rect x="115" y="20" width="90" height="160" rx="16" fill="url(#phoneBodyGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <!-- Dynamic Island / Speaker -->
    <rect x="145" y="25" width="30" height="6" rx="3" fill="#07090e" />
    <!-- Screen View -->
    <rect x="121" y="35" width="78" height="138" rx="10" fill="#080a10" />

    <!-- Social Story Header Rings -->
    <circle cx="135" cy="48" r="7" stroke="url(#storyGrad)" stroke-width="1.5" fill="#10131d" />
    <circle cx="155" cy="48" r="7" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="#10131d" />
    <circle cx="175" cy="48" r="7" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="#10131d" />
    <circle cx="185" cy="48" r="7" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="#10131d" />

    <!-- Instagram / Carousel Main Post Visual -->
    <rect x="127" y="62" width="66" height="66" rx="6" fill="#151824" stroke="#ffbe1a" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="160" cy="90" r="16" fill="#ffbe1a" fill-opacity="0.2" />
    <!-- Carousel Dots -->
    <circle cx="154" cy="122" r="1.5" fill="#ffbe1a" />
    <circle cx="160" cy="122" r="1.5" fill="#ffffff" fill-opacity="0.3" />
    <circle cx="166" cy="122" r="1.5" fill="#ffffff" fill-opacity="0.3" />

    <!-- Engagement Icons -->
    <path d="M129 135 C129 132 133 132 134 135 C135 132 139 132 139 135 C139 138 134 140 134 140 C134 140 129 138 129 135 Z" fill="#f43f5e" />
    <circle cx="146" cy="136" r="3" fill="#ffffff" fill-opacity="0.5" />
    <polygon points="156,133 162,136 156,139" fill="#ffffff" fill-opacity="0.5" />
    <path d="M185 133 L189 133 L189 140 L187 138 L185 140 Z" fill="#ffbe1a" />

    <!-- Caption Lines -->
    <line x1="129" y1="147" x2="165" y2="147" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" />
    <line x1="129" y1="154" x2="185" y2="154" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="129" y1="160" x2="175" y2="160" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
  </g>
</svg>
