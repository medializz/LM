<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c2b" />
      <stop offset="100%" stop-color="#0a0c13" />
    </linearGradient>
    <filter id="shadowC" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Calendar Schedule Matrix Board -->
  <g filter="url(#shadowC)">
    <rect x="50" y="30" width="220" height="140" rx="12" fill="url(#calGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2" />
    
    <!-- Topbar Header -->
    <rect x="50" y="30" width="220" height="32" rx="12" fill="#121520" />
    <text x="68" y="50" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">PUBLISHING QUEUE</text>
    <rect x="210" y="40" width="48" height="14" rx="7" fill="#ffbe1a" fill-opacity="0.15" stroke="#ffbe1a" stroke-width="0.8" />
    <text x="220" y="50" fill="#ffbe1a" font-family="monospace" font-size="7" font-weight="bold">SCHEDULED</text>

    <!-- Calendar Grid Columns (Mon, Tue, Wed, Thu) -->
    <!-- Day 1 Post -->
    <g transform="translate(65, 72)">
      <rect x="0" y="0" width="44" height="85" rx="6" fill="#10131d" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <rect x="4" y="4" width="36" height="28" rx="4" fill="#38bdf8" fill-opacity="0.2" />
      <text x="6" y="42" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="bold">09:00 AM</text>
      <line x1="6" y1="50" x2="38" y2="50" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
      <line x1="6" y1="56" x2="30" y2="56" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="36" cy="74" r="4" fill="#22c55e" />
    </g>

    <!-- Day 2 Post (Highlighted) -->
    <g transform="translate(115, 72)">
      <rect x="0" y="0" width="44" height="85" rx="6" fill="#151928" stroke="#ffbe1a" stroke-opacity="0.8" stroke-width="1.5" />
      <rect x="4" y="4" width="36" height="28" rx="4" fill="#ffbe1a" fill-opacity="0.25" />
      <circle cx="22" cy="18" r="7" fill="#ffbe1a" />
      <text x="6" y="42" fill="#ffbe1a" font-family="sans-serif" font-size="6" font-weight="bold">01:30 PM</text>
      <line x1="6" y1="50" x2="38" y2="50" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" />
      <line x1="6" y1="56" x2="34" y2="56" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="36" cy="74" r="4" fill="#ffbe1a" />
    </g>

    <!-- Day 3 Post -->
    <g transform="translate(165, 72)">
      <rect x="0" y="0" width="44" height="85" rx="6" fill="#10131d" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1" />
      <rect x="4" y="4" width="36" height="28" rx="4" fill="#a78bfa" fill-opacity="0.2" />
      <text x="6" y="42" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="bold">06:00 PM</text>
      <line x1="6" y1="50" x2="38" y2="50" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
      <line x1="6" y1="56" x2="30" y2="56" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="36" cy="74" r="4" fill="#a78bfa" />
    </g>

    <!-- Day 4 Post -->
    <g transform="translate(215, 72)">
      <rect x="0" y="0" width="44" height="85" rx="6" fill="#10131d" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
      <rect x="4" y="4" width="36" height="28" rx="4" fill="#f43f5e" fill-opacity="0.2" />
      <text x="6" y="42" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="bold">08:45 PM</text>
      <line x1="6" y1="50" x2="38" y2="50" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
      <line x1="6" y1="56" x2="30" y2="56" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="36" cy="74" r="4" fill="#22c55e" />
    </g>
  </g>
</svg>
