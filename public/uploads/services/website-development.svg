<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="desktopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b28" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <linearGradient id="goldWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ffbe1a" />
    </linearGradient>
    <filter id="shadowWD" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Large Desktop / Studio Display (Center/Left) -->
  <g filter="url(#shadowWD)">
    <!-- Monitor Bezel -->
    <rect x="50" y="25" width="180" height="118" rx="8" fill="#121520" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
    <!-- Screen -->
    <rect x="58" y="33" width="164" height="102" rx="4" fill="url(#desktopScreen)" />

    <!-- Browser Header Bar -->
    <rect x="58" y="33" width="164" height="12" fill="#0d0f16" />
    <circle cx="66" cy="39" r="1.8" fill="#ff5f56" />
    <circle cx="72" cy="39" r="1.8" fill="#ffbd2e" />
    <circle cx="78" cy="39" r="1.8" fill="#27c93f" />
    <rect x="92" y="36" width="60" height="6" rx="3" fill="#1b1f2e" />

    <!-- Website Hero Layout on Screen -->
    <rect x="68" y="52" width="65" height="8" rx="2" fill="#ffffff" fill-opacity="0.9" />
    <rect x="68" y="64" width="80" height="4" rx="1.5" fill="#94a3b8" />
    <rect x="68" y="72" width="55" height="4" rx="1.5" fill="#94a3b8" />
    <!-- CTA Button -->
    <rect x="68" y="82" width="34" height="10" rx="5" fill="url(#goldWeb)" />

    <!-- Visual Graphic on Screen Right -->
    <rect x="156" y="52" width="58" height="46" rx="4" fill="#141724" stroke="#ffbe1a" stroke-opacity="0.3" stroke-width="0.8" />
    <circle cx="185" cy="72" r="12" fill="url(#goldWeb)" fill-opacity="0.3" />
    <polygon points="185,64 193,78 177,78" fill="url(#goldWeb)" />

    <!-- Bottom Feature Cards on Screen -->
    <rect x="68" y="104" width="44" height="24" rx="3" fill="#121520" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6" />
    <rect x="118" y="104" width="44" height="24" rx="3" fill="#121520" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6" />
    <rect x="168" y="104" width="44" height="24" rx="3" fill="#121520" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6" />

    <!-- Monitor Stand -->
    <path d="M130 143 L150 143 L154 162 L126 162 Z" fill="#161926" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.8" />
    <ellipse cx="140" cy="162" rx="28" ry="4" fill="#10131d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.8" />
  </g>

  <!-- Mobile Device Overlapping (Right) -->
  <g filter="url(#shadowWD)">
    <rect x="205" y="60" width="55" height="105" rx="10" fill="#1e2233" stroke="url(#goldWeb)" stroke-opacity="0.8" stroke-width="1.2" />
    <rect x="210" y="66" width="45" height="93" rx="7" fill="#080a10" />
    <!-- Dynamic Island -->
    <rect x="225" y="69" width="15" height="3" rx="1.5" fill="#161926" />
    
    <!-- Mobile Responsive View -->
    <rect x="215" y="77" width="25" height="4" rx="1" fill="#ffffff" />
    <rect x="215" y="84" width="35" height="22" rx="3" fill="#141724" stroke="#ffbe1a" stroke-opacity="0.4" stroke-width="0.6" />
    <circle cx="232" cy="95" r="5" fill="url(#goldWeb)" />

    <rect x="215" y="110" width="35" height="12" rx="2" fill="#121520" />
    <rect x="215" y="126" width="35" height="12" rx="2" fill="#121520" />
    <rect x="215" y="142" width="20" height="6" rx="3" fill="url(#goldWeb)" />
  </g>
</svg>
