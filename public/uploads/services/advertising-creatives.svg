<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="adGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222738" />
      <stop offset="100%" stop-color="#0b0d14" />
    </linearGradient>
    <linearGradient id="goldAd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ffbe1a" />
    </linearGradient>
    <filter id="shadowAd" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Story / Vertical 9:16 Ad Card (Left) -->
  <g transform="rotate(-6 100 100)" filter="url(#shadowAd)">
    <rect x="45" y="30" width="70" height="135" rx="10" fill="url(#adGrad1)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2" />
    <!-- Visual Image Top -->
    <rect x="52" y="38" width="56" height="60" rx="6" fill="#151824" />
    <circle cx="80" cy="68" r="14" fill="url(#goldAd)" fill-opacity="0.4" />
    <polygon points="80,58 90,75 70,75" fill="url(#goldAd)" />
    
    <!-- Headline & CTA -->
    <line x1="52" y1="106" x2="95" y2="106" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" />
    <line x1="52" y1="114" x2="85" y2="114" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Shop Now / CTA Button -->
    <rect x="52" y="130" width="56" height="18" rx="9" fill="url(#goldAd)" />
    <text x="63" y="142" fill="#000000" font-family="sans-serif" font-size="6.5" font-weight="900">GET 50% OFF</text>
  </g>

  <!-- Feed Square 1:1 Ad Card (Center/Right) -->
  <g transform="rotate(5 180 100)" filter="url(#shadowAd)">
    <rect x="135" y="35" width="130" height="130" rx="12" fill="#121520" stroke="url(#goldAd)" stroke-opacity="0.6" stroke-width="1.5" />
    
    <!-- Hero Image Area -->
    <rect x="145" y="45" width="110" height="68" rx="8" fill="#1a1d2c" />
    <circle cx="200" cy="79" r="18" fill="url(#goldAd)" fill-opacity="0.25" stroke="url(#goldAd)" stroke-width="1" />
    <path d="M190 85 L200 68 L210 85 Z" fill="url(#goldAd)" />
    
    <!-- High CTR Badge -->
    <rect x="150" y="50" width="38" height="14" rx="7" fill="#ffbe1a" />
    <text x="156" y="60" fill="#000000" font-family="monospace" font-size="6" font-weight="bold">TOP AD</text>

    <!-- Copy & Conversion Button -->
    <text x="145" y="125" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="bold">HIGH-CTR CREATIVE</text>
    
    <!-- CTA Button -->
    <rect x="145" y="134" width="70" height="18" rx="6" fill="url(#goldAd)" />
    <text x="155" y="146" fill="#000000" font-family="sans-serif" font-size="6.5" font-weight="bold">LEARN MORE →</text>
    
    <!-- CTR Metric Indicator -->
    <text x="225" y="146" fill="#22c55e" font-family="monospace" font-size="7" font-weight="bold">6.4% CTR</text>
  </g>
</svg>
