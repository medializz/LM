<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffbe1a" />
      <stop offset="100%" stop-color="#d49400" />
    </linearGradient>
    <radialGradient id="glowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbe1a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffbe1a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="160" cy="100" r="75" fill="url(#glowRadial)" />

  <!-- Construction Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.8" stroke-dasharray="3 3">
    <circle cx="160" cy="100" r="65" />
    <circle cx="160" cy="100" r="42" />
    <circle cx="160" cy="100" r="22" />
    <line x1="60" y1="100" x2="260" y2="100" />
    <line x1="160" y1="20" x2="160" y2="180" />
    <line x1="90" y1="30" x2="230" y2="170" />
    <line x1="90" y1="170" x2="230" y2="30" />
  </g>

  <!-- Vector Anchor Points -->
  <g fill="#ffbe1a" stroke="#ffffff" stroke-width="1.2">
    <rect x="156" y="32" width="8" height="8" rx="1.5" />
    <rect x="156" y="160" width="8" height="8" rx="1.5" />
    <rect x="96" y="96" width="8" height="8" rx="1.5" />
    <rect x="216" y="96" width="8" height="8" rx="1.5" />
    <circle cx="160" cy="100" r="3.5" fill="#ffffff" stroke="#ffbe1a" stroke-width="1.5" />
  </g>

  <!-- Geometric Logo Icon Badge -->
  <g filter="url(#shadowL)">
    <!-- Outer Shield / Hexagon Shape -->
    <path d="M160 48 L205 74 L205 126 L160 152 L115 126 L115 74 Z" fill="#121520" stroke="url(#goldGradL)" stroke-width="2.5" />
    
    <!-- Inner Stylized Monogram / Eagle Form -->
    <path d="M160 62 L188 80 L174 122 L160 108 L146 122 L132 80 Z" fill="url(#goldGradL)" />
    <polygon points="160,82 170,98 150,98" fill="#121520" />
  </g>

  <!-- Bezier Control Handles -->
  <line x1="160" y1="36" x2="200" y2="28" stroke="#ffbe1a" stroke-width="1" />
  <circle cx="200" cy="28" r="2.5" fill="#ffbe1a" />
  <line x1="160" y1="36" x2="120" y2="28" stroke="#ffbe1a" stroke-width="1" />
  <circle cx="120" cy="28" r="2.5" fill="#ffbe1a" />
</svg>
