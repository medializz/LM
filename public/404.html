<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Lizzdo Media</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script with Strict HTTPS Enforcement
      (function() {
        var l = window.location;
        // If accessed over insecure HTTP in production, immediately upgrade to HTTPS
        if (l.protocol === 'http:' && l.hostname !== 'localhost' && l.hostname !== '127.0.0.1') {
          l.replace('https://' + l.host + l.pathname + l.search + l.hash);
          return;
        }

        var pathSegmentsToKeep = 0;
        var targetProtocol = (l.hostname === 'localhost' || l.hostname === '127.0.0.1') ? l.protocol : 'https:';
        l.replace(
          targetProtocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
