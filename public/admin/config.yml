backend:
  name: github
  repo: lizzdo/media
  branch: main
  site_domain: media.lizzdo.com

# When running locally or during development:
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # =========================================================================
  # 1. SITE SETTINGS (GLOBAL BRAND, LOGO, CONTACT, SOCIAL, SEO)
  # =========================================================================
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings & Global Brand"
        file: "src/content/settings.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", default: "Lizzdo Media" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Creative & Digital Agency" }
          - { label: "Master Logo (SVG/PNG)", name: "logo", widget: "image", default: "/uploads/lizzdo-media-logo.svg", required: false }
          - { label: "Logo for Dark Background", name: "logoDark", widget: "image", default: "/uploads/lizzdo-media-logo.svg", required: false }
          - { label: "Logo for Light Background", name: "logoLight", widget: "image", default: "/uploads/lizzdo-media-logo-light.svg", required: false }
          - { label: "Logo Mark / Icon", name: "logoMark", widget: "image", default: "/uploads/lizzdo-media-mark.svg", required: false }
          - { label: "Favicon", name: "favicon", widget: "image", default: "/uploads/lizzdo-media-mark.svg", required: false }
          - { label: "Contact Email", name: "contactEmail", widget: "string", default: "contact@media.lizzdo.com" }
          - { label: "WhatsApp / Phone", name: "whatsappNumber", widget: "string", default: "+1234567890" }
          - { label: "Instagram Link", name: "instagramUrl", widget: "string", required: false }
          - { label: "Facebook Link", name: "facebookUrl", widget: "string", required: false }
          - { label: "LinkedIn Link", name: "linkedinUrl", widget: "string", required: false }
          - { label: "X / Twitter Link", name: "twitterUrl", widget: "string", required: false }
          - { label: "Business Location", name: "location", widget: "string", default: "Global Digital Agency", required: false }
          - { label: "Inquiry Form Endpoint (e.g. Formspree / Webhook URL)", name: "formEndpoint", widget: "string", required: false }
          - { label: "Footer Text", name: "footerText", widget: "text", required: false }
          - { label: "Copyright Text", name: "copyrightText", widget: "string", default: "© 2026 Lizzdo Media. All rights reserved." }
          - { label: "Header CTA Text", name: "primaryCtaText", widget: "string", default: "Let's Talk" }
          - { label: "Header CTA URL", name: "primaryCtaUrl", widget: "string", default: "/contact" }
          - { label: "Parent Company URL", name: "parentCompanyUrl", widget: "string", default: "https://lizzdo.com/" }
          - { label: "Current Domain", name: "currentDomain", widget: "string", default: "https://media.lizzdo.com/" }

      - name: "hero"
        label: "Homepage Hero Section"
        file: "src/content/hero.json"
        fields:
          - { label: "Hero Eyebrow", name: "eyebrow", widget: "string", default: "Creative & Digital Agency" }
          - { label: "Headline Line 1", name: "headlineLine1", widget: "string", default: "Design. Build." }
          - { label: "Headline Line 2 Prefix", name: "headlineLine2Prefix", widget: "string", default: "Grow. " }
          - { label: "Headline Highlighted Word", name: "headlineHighlightedWord", widget: "string", default: "Together." }
          - { label: "Hero Description", name: "description", widget: "text", default: "We help brands stand out and grow with creative design, powerful websites, and result-driven digital solutions." }
          - { label: "Primary CTA Label", name: "primaryCtaText", widget: "string", default: "Explore Our Work" }
          - { label: "Primary CTA URL", name: "primaryCtaUrl", widget: "string", default: "/work" }

  # =========================================================================
  # 2. SERVICES COLLECTION
  # =========================================================================
  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "select", options: ["Brand Identity", "Logo Design", "Graphic Design", "Packaging Design", "Social Media Design", "Social Media Content", "Social Media Management", "Digital Marketing", "Advertising Creatives", "AI Visual Content", "Website Development", "Simple Business Websites", "Content Posting", "Marketing Campaigns"], required: true }
      - { label: "Icon Identifier", name: "iconKey", widget: "string", default: "brand-identity" }
      - { label: "Service Preview Image", name: "previewImage", widget: "image", required: false, hint: "Upload a transparent PNG, WebP, or SVG thumbnail/mockup visual for the service card." }
      - { label: "Preview Image Alt Text", name: "previewImageAlt", widget: "string", required: false, hint: "Descriptive alt text for the service visual preview." }
      - { label: "Short Description", name: "short_description", widget: "text", required: true }
      - { label: "Hero Image", name: "hero_image", widget: "image", required: false }
      - { label: "Hero Image Alt Text", name: "hero_image_alt", widget: "string", required: false }
      - { label: "Service Overview", name: "overview", widget: "markdown", required: false }
      - { label: "What We Offer", name: "what_we_offer", widget: "markdown", required: false }
      - { label: "Deliverables List", name: "deliverables", widget: "list", required: false }
      - { label: "Process & Steps", name: "process", widget: "list", required: false }
      - { label: "Key Benefits", name: "benefits", widget: "list", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - label: "Frequently Asked Questions (FAQ)"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Related Work Projects (slugs)", name: "related_work", widget: "list", required: false }
      - { label: "SEO Meta Title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seo_description", widget: "text", required: false }
      - { label: "Open Graph Image", name: "og_image", widget: "image", required: false }

  # =========================================================================
  # 3. WORK & CASE STUDIES COLLECTION
  # =========================================================================
  - name: "portfolio"
    label: "Work"
    folder: "src/content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "string", required: true }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: true }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Date", name: "date", widget: "date", required: false }
      - { label: "Year", name: "year", widget: "string", default: "2026", required: false }
      - { label: "Client Name", name: "client", widget: "string", required: false }
      - { label: "Short Description", name: "short_description", widget: "text", required: false }
      - { label: "Hero Image", name: "hero_image", widget: "image", required: false }
      - { label: "Hero Image Alt Text", name: "hero_image_alt", widget: "string", required: false }
      - { label: "Project Overview", name: "project_overview", widget: "markdown", required: false }
      - { label: "01 Challenge", name: "challenge", widget: "text", required: false }
      - { label: "02 Strategy / Solution", name: "solution", widget: "text", required: false }
      - { label: "03 Creative Direction", name: "creative_direction", widget: "text", required: false }
      - { label: "04 Deliverables", name: "deliverables", widget: "list", required: false }
      - { label: "Tools Used", name: "tools", widget: "list", required: false }
      - { label: "05 Results & Outcomes", name: "results", widget: "text", required: false }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image File", name: "image", widget: "image", required: true }
          - { label: "Alt Text", name: "alt", widget: "string", required: false }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Display Order", name: "order", widget: "number", value_type: "int", required: false }
          - { label: "Layout Span", name: "layout", widget: "select", options: ["large", "half"], default: "half" }
      - { label: "Related Projects (slugs)", name: "related_projects", widget: "list", required: false }
      - { label: "Related Services (slugs)", name: "related_services", widget: "list", required: false }
      - { label: "SEO Meta Title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seo_description", widget: "text", required: false }
      - { label: "Open Graph Image", name: "og_image", widget: "image", required: false }

  # =========================================================================
  # 4. BLOG & ARTICLES COLLECTION
  # =========================================================================
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
      - { label: "Excerpt / Summary", name: "excerpt", widget: "text", required: true }
      - { label: "Body (Markdown)", name: "body", widget: "markdown", required: true }
      - label: "Author"
        name: "author"
        widget: "object"
        fields:
          - { label: "Author Name", name: "name", widget: "string", default: "Lizzdo Creative Team" }
          - { label: "Role / Job Title", name: "role", widget: "string", default: "Brand Strategist" }
          - { label: "Avatar Image", name: "avatar", widget: "image", required: false }
      - { label: "Publish Date", name: "publish_date", widget: "date", required: true }
      - { label: "Category", name: "category", widget: "string", default: "Design Strategy" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "SEO Meta Title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seo_description", widget: "text", required: false }
      - { label: "Open Graph Image", name: "og_image", widget: "image", required: false }

  # =========================================================================
  # 5. GLOBAL FAQS COLLECTION
  # =========================================================================
  - name: "faqs"
    label: "FAQs"
    folder: "src/content/faqs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string", required: true }
      - { label: "Answer", name: "answer", widget: "text", required: true }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Category / Location", name: "category", widget: "select", options: ["General", "Services", "Work", "Pricing", "Process"], default: "General" }

  # =========================================================================
  # 6. OUR PROCESS COLLECTION
  # =========================================================================
  - name: "process"
    label: "Our Process"
    folder: "src/content/process"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Step Number (e.g. 01)", name: "stepNumber", widget: "string" }
      - { label: "Step Title", name: "title", widget: "string" }
      - { label: "Icon Identifier", name: "iconKey", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }

  # =========================================================================
  # 7. WHY CHOOSE US
  # =========================================================================
  - name: "whyChooseUs"
    label: "Why Choose Us"
    delete: false
    editor:
      preview: false
    files:
      - name: "content"
        label: "Section Copy & CTA"
        file: "src/content/why-choose-us.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "WHY CHOOSE US" }
          - { label: "Heading Prefix", name: "headingPrefix", widget: "string", default: "Why Brands Choose " }
          - { label: "Heading Highlight", name: "headingHighlight", widget: "string", default: "Lizzdo Media" }
          - { label: "Description", name: "description", widget: "text", default: "We combine creativity, strategy, and technology to deliver exceptional results that help brands grow faster and stronger." }
          - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "Let's Work Together" }
          - { label: "CTA Button URL", name: "ctaUrl", widget: "string", default: "/contact" }

  # =========================================================================
  # 8. STATISTICS COLLECTION
  # =========================================================================
  - name: "statistics"
    label: "Statistics"
    folder: "src/content/statistics"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Value (e.g. 250+)", name: "value", widget: "string" }
      - { label: "Label (e.g. Happy Clients)", name: "label", widget: "string" }
      - { label: "Sublabel", name: "sublabel", widget: "string" }
      - { label: "Icon Identifier", name: "iconKey", widget: "string" }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }

  # =========================================================================
  # 9. TESTIMONIALS COLLECTION
  # =========================================================================
  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Author Name", name: "author", widget: "string" }
      - { label: "Role / Position", name: "role", widget: "string" }
      - { label: "Company", name: "company", widget: "string" }
      - { label: "Avatar Image", name: "avatar", widget: "image", required: false }
