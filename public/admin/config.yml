backend:
  name: github
  repo: medializz/LM # GitHub repository
  branch: main # Production deployment branch
  base_url: https://media-lizzdo-auth.lets3do.workers.dev # Existing Cloudflare OAuth Worker URL
  auth_endpoint: auth # OAuth auth endpoint (GET /auth)
  site_domain: media.lizzdo.com

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # =========================================================================
  # 1. SITE SETTINGS & CONFIGURATION
  # =========================================================================
  - name: "settings"
    label: "Site Settings & Configuration"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings & Global Brand"
        file: "src/content/settings.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", default: "Lizzdo Media" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Creative & Digital Agency" }
          - { label: "Logo Text", name: "logoText", widget: "string", default: "LIZZDO MEDIA" }
          - { label: "Master Logo (Dark SVG/PNG)", name: "logo", widget: "image", default: "/uploads/lizzdo-media-logo.svg", required: false }
          - { label: "Logo Dark", name: "logoDark", widget: "image", default: "/uploads/lizzdo-media-logo.svg", required: false }
          - { label: "Logo Light", name: "logoLight", widget: "image", default: "/uploads/lizzdo-media-logo-light.svg", required: false }
          - { label: "Logo Mark / Favicon Icon", name: "logoMark", widget: "image", default: "/uploads/lizzdo-media-mark.svg", required: false }
          - { label: "Favicon", name: "favicon", widget: "image", default: "/uploads/lizzdo-media-mark.svg", required: false }
          - { label: "Primary Contact Email", name: "contactEmail", widget: "string", default: "contact@media.lizzdo.com" }
          - { label: "Business Email", name: "businessEmail", widget: "string", default: "business@media.lizzdo.com", required: false }
          - { label: "Support Email", name: "supportEmail", widget: "string", default: "support@media.lizzdo.com", required: false }
          - { label: "Phone Number (Calling / Tel)", name: "phone", widget: "string", required: false, hint: "Studio phone with country code e.g. +92 300 0000000" }
          - { label: "WhatsApp Direct Number", name: "whatsappNumber", widget: "string", required: false, hint: "Master studio WhatsApp number with country code" }
          - { label: "WhatsApp Description", name: "whatsappDescription", widget: "string", default: "Chat directly with our creative team on WhatsApp for expedited project scoping and immediate consultations.", required: false }
          - { label: "WhatsApp Prefilled Message", name: "whatsappPrefilledMessage", widget: "string", default: "Hello Lizzdo Media, I would like to discuss a project with your team.", required: false }
          - { label: "WhatsApp CTA Text", name: "whatsappCtaText", widget: "string", default: "Chat on WhatsApp Now", required: false }
          - { label: "Location", name: "location", widget: "string", default: "Global Digital Agency", required: false }
          - { label: "Address", name: "address", widget: "string", default: "Global Creative Studio & Digital Innovation Hub", required: false }
          - { label: "Header CTA Text", name: "primaryCtaText", widget: "string", default: "Let's Talk" }
          - { label: "Header CTA URL", name: "primaryCtaUrl", widget: "string", default: "/contact" }
          - { label: "Parent Company URL", name: "parentCompanyUrl", widget: "string", default: "https://lizzdo.com/" }
          - { label: "Current Domain", name: "currentDomain", widget: "string", default: "https://media.lizzdo.com/" }
          - { label: "Inquiry Form Webhook URL", name: "formEndpoint", widget: "string", required: false }
          - { label: "Footer Description", name: "footerText", widget: "text", required: false }
          - { label: "Copyright Text", name: "copyrightText", widget: "string", default: "© 2026 Lizzdo Media. All rights reserved." }

      - name: "social"
        label: "Social Media Settings"
        file: "src/content/social.json"
        fields:
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
          - { label: "Twitter / X URL", name: "twitter", widget: "string", required: false }
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
          - { label: "TikTok URL", name: "tiktok", widget: "string", required: false }
          - { label: "Pinterest URL", name: "pinterest", widget: "string", required: false }
          - { label: "Behance URL", name: "behance", widget: "string", required: false }
          - { label: "Dribbble URL", name: "dribbble", widget: "string", required: false }
          - { label: "GitHub URL", name: "github", widget: "string", required: false }

      - name: "aboutPage"
        label: "About Page Content"
        file: "src/content/about.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "AGENCY OVERVIEW & PHILOSOPHY" }
          - { label: "Headline Line 1", name: "headlineLine1", widget: "string", default: "Design. Build." }
          - { label: "Headline Highlight", name: "headlineHighlight", widget: "string", default: "Grow. Together." }
          - { label: "Introduction Description", name: "introDescription", widget: "text" }
          - { label: "Mission Title", name: "missionTitle", widget: "string", default: "Our Mission" }
          - { label: "Mission Description", name: "missionDescription", widget: "text" }
          - { label: "Vision Title", name: "visionTitle", widget: "string", default: "Our Vision" }
          - { label: "Vision Description", name: "visionDescription", widget: "text" }
          - { label: "Story Title", name: "storyTitle", widget: "string", default: "Built on Strategy, Craft & Speed" }
          - { label: "Story Description", name: "storyDescription", widget: "text" }
          - { label: "CTA Title", name: "ctaTitle", widget: "string", default: "Ready to Build Something Extraordinary?" }
          - { label: "CTA Description", name: "ctaDescription", widget: "text" }
          - { label: "CTA Button Text", name: "ctaButtonText", widget: "string", default: "Start a Project" }
          - { label: "CTA Button URL", name: "ctaButtonUrl", widget: "string", default: "/contact" }
          - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
          - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }

      - name: "contactPage"
        label: "Contact Page Content"
        file: "src/content/contact.json"
        fields:
          - { label: "Contact Heading", name: "heading", widget: "string", default: "Start a Project or Request an Estimate" }
          - { label: "Contact Subtitle", name: "subtitle", widget: "string", default: "Direct Studio Inquiry & Estimated Budget", required: false }
          - { label: "Contact Tagline", name: "tagline", widget: "string", default: "Direct Studio Inquiry", required: false }
          - { label: "Contact Description", name: "description", widget: "text" }
          - { label: "Email Button CTA Text", name: "emailCtaText", widget: "string", default: "Send an Email", required: false }
          - { label: "Office Availability", name: "availability", widget: "string", default: "Monday – Friday: 9:00 AM – 6:00 PM (EST)", required: false }
          - { label: "Direct WhatsApp Card Heading", name: "ctaHeading", widget: "string", default: "Prefer Instant Messaging?" }
          - { label: "Direct WhatsApp Card Subtext", name: "ctaText", widget: "text", default: "Chat directly on WhatsApp for expedited project scoping, quick questions, and immediate consultations." }
          - { label: "Enable Embedded / External Form", name: "contactFormEnabled", widget: "boolean", default: true }
          - { label: "Form Integration Type", name: "contactFormType", widget: "select", options: ["native", "embed"], default: "native" }
          - { label: "Form Embed URL (Tally / Google Forms / Typeform / etc.)", name: "contactFormUrl", widget: "string", required: false }
          - { label: "Form Iframe Title", name: "contactFormTitle", widget: "string", default: "Project Inquiry Form", required: false }
          - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
          - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
          - { label: "OG Share Image", name: "ogImage", widget: "image", default: "/uploads/og-cover.png", required: false }

      - name: "analytics"
        label: "Analytics & Tracking"
        file: "src/content/analytics.json"
        fields:
          - { label: "Enable Google Analytics 4", name: "googleAnalyticsEnabled", widget: "boolean", default: false }
          - { label: "GA4 Measurement ID (e.g. G-XXXXXXXXXX)", name: "measurementId", widget: "string", required: false }
          - { label: "Google Tag Manager ID (optional)", name: "googleTagManagerId", widget: "string", required: false }
          - { label: "Enable Cookie Consent Banner", name: "cookieConsentEnabled", widget: "boolean", default: true }

      - name: "seo"
        label: "Global SEO & Meta Configuration"
        file: "src/content/seo.json"
        fields:
          - { label: "Global SEO Title", name: "globalTitle", widget: "string" }
          - { label: "Default Meta Description", name: "defaultDescription", widget: "text" }
          - { label: "Global Keywords", name: "keywords", widget: "string" }
          - { label: "Canonical Base URL", name: "canonicalUrl", widget: "string", default: "https://media.lizzdo.com/" }
          - { label: "Default OG Image", name: "ogImage", widget: "image", default: "/uploads/og-cover.png" }
          - { label: "Twitter Card Format", name: "twitterCard", widget: "string", default: "summary_large_image" }

      - name: "hero"
        label: "Homepage Hero Section"
        file: "src/content/hero.json"
        fields:
          - { label: "Hero Eyebrow", name: "eyebrow", widget: "string", default: "Creative & Digital Agency" }
          - { label: "Headline Line 1", name: "headlineLine1", widget: "string", default: "Design. Build." }
          - { label: "Headline Line 2 Prefix", name: "headlineLine2Prefix", widget: "string", default: "Grow. " }
          - { label: "Headline Highlighted Word", name: "headlineHighlightedWord", widget: "string", default: "Together." }
          - { label: "Hero Description", name: "description", widget: "text", default: "We help brands stand out and grow with creative design, powerful websites, and result-driven digital solutions." }
          - { label: "Primary CTA Label", name: "primaryCtaText", widget: "string", default: "Explore Our Work" }
          - { label: "Primary CTA URL", name: "primaryCtaUrl", widget: "string", default: "/work" }

      - name: "footer"
        label: "Footer Section & CTA"
        file: "src/content/footer.json"
        fields:
          - { label: "Footer CTA Headline", name: "ctaHeadline", widget: "string" }
          - { label: "Footer CTA Description", name: "ctaDescription", widget: "text" }
          - { label: "Primary CTA Text", name: "ctaPrimaryText", widget: "string" }
          - { label: "Primary CTA URL", name: "ctaPrimaryUrl", widget: "string" }
          - { label: "WhatsApp Button Text", name: "ctaWhatsAppText", widget: "string" }
          - { label: "Footer Description", name: "footerDescription", widget: "text" }
          - { label: "Copyright Notice", name: "copyrightText", widget: "string" }
          - { label: "Parent Company Label", name: "parentCompanyLabel", widget: "string" }
          - { label: "Parent Company URL", name: "parentCompanyUrl", widget: "string" }

      - name: "whyChooseUs"
        label: "Why Choose Us Section"
        file: "src/content/why-choose-us.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "WHY CHOOSE US" }
          - { label: "Heading Prefix", name: "headingPrefix", widget: "string", default: "Why Brands Choose " }
          - { label: "Heading Highlight", name: "headingHighlight", widget: "string", default: "Lizzdo Media" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "Let's Work Together" }
          - { label: "CTA Button URL", name: "ctaUrl", widget: "string", default: "/contact" }

      - name: "clientsSection"
        label: "Companies We've Worked With Section"
        file: "src/content/clients-section.json"
        fields:
          - { label: "Section Eyebrow", name: "eyebrow", widget: "string", default: "BRANDS WE'VE WORKED WITH" }
          - { label: "Heading Prefix", name: "headingPrefix", widget: "string", default: "Companies We've " }
          - { label: "Heading Highlight Word", name: "headingHighlight", widget: "string", default: "Worked With" }
          - { label: "Introductory Description", name: "description", widget: "text", default: "From brand identity and social content to websites and digital campaigns, we've partnered with forward-thinking businesses across diverse industries." }

      - name: "testimonialsSection"
        label: "Testimonials / Client Reviews Section"
        file: "src/content/testimonials-section.json"
        fields:
          - { label: "Section Eyebrow", name: "eyebrow", widget: "string", default: "CLIENT TESTIMONIALS" }
          - { label: "Heading Prefix", name: "headingPrefix", widget: "string", default: "Trusted by " }
          - { label: "Heading Highlight Word", name: "headingHighlight", widget: "string", default: "Industry Leaders" }
          - { label: "Introductory Description", name: "description", widget: "text", default: "What founders, marketing directors, and product teams say about partnering with Lizzdo Media." }

  # =========================================================================
  # 2. CLIENTS / COMPANIES WE'VE WORKED WITH COLLECTION
  # =========================================================================
  - name: "clients"
    label: "Clients / Companies"
    folder: "src/content/clients"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Company Name", name: "name", widget: "string", required: true }
      - { label: "Slug Identifier", name: "slug", widget: "string", required: true }
      - { label: "Client Logo (SVG, WebP, PNG)", name: "logo", widget: "image", required: true }
      - { label: "Logo Alt Text", name: "logoAlt", widget: "string", required: false, default: "Company logo" }
      - { label: "Company Website URL (Optional)", name: "websiteUrl", widget: "string", required: false }
      - { label: "Services Provided", name: "services", widget: "list", required: false }
      - { label: "Short Project Description", name: "shortDescription", widget: "text", required: false }
      - { label: "Related Work Case Study Slug (Optional)", name: "relatedWork", widget: "string", required: false }
      - { label: "Related Work Title", name: "relatedWorkTitle", widget: "string", required: false }
      - { label: "Enable Client Review", name: "reviewEnabled", widget: "boolean", default: false }
      - { label: "Client Review / Testimonial Text", name: "reviewText", widget: "text", required: false }
      - { label: "Reviewer Name", name: "reviewerName", widget: "string", required: false }
      - { label: "Reviewer Position / Title", name: "reviewerPosition", widget: "string", required: false }
      - { label: "Reviewer Photo (Optional)", name: "reviewerPhoto", widget: "image", required: false }
      - { label: "Rating (1 to 5 - Optional)", name: "rating", widget: "number", value_type: "int", required: false }
      - { label: "Featured Client", name: "featured", widget: "boolean", default: true }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Sort Order", name: "order", widget: "number", value_type: "int", default: 1 }

  # =========================================================================
  # 3. SERVICES COLLECTION
  # =========================================================================
  - name: "services"
    label: "Services"
    folder: "src/content/services"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "string", required: true }
      - { label: "Icon Identifier", name: "iconKey", widget: "string", default: "brand-identity" }
      - { label: "Service Preview Image", name: "previewImage", widget: "image", required: false }
      - { label: "Preview Image Alt Text", name: "previewImageAlt", widget: "string", required: false }
      - { label: "Short Description", name: "shortDescription", widget: "text", required: true }
      - { label: "Hero Headline", name: "heroHeadline", widget: "string", required: false }
      - { label: "Hero Highlight Phrase", name: "heroHighlight", widget: "string", required: false }
      - { label: "Hero Description", name: "heroDescription", widget: "text", required: false }
      - { label: "CTA Button Text", name: "ctaButtonText", widget: "string", default: "Build My Brand →" }
      - { label: "Key Capabilities", name: "capabilities", widget: "list", required: false }
      - { label: "Deliverables List", name: "deliverables", widget: "list", required: false }
      - label: "Process Steps"
        name: "processSteps"
        widget: "list"
        required: false
        fields:
          - { label: "Step Number (e.g. 01)", name: "stepNumber", widget: "string" }
          - { label: "Step Title", name: "title", widget: "string" }
          - { label: "Step Description", name: "description", widget: "text" }
      - label: "Gallery Mockups"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "ID", name: "id", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Visual Type Identifier", name: "visualType", widget: "string", required: false }
          - { label: "Layout Span", name: "layout", widget: "select", options: ["large", "half"], default: "half" }
      - label: "Frequently Asked Questions (FAQ)"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Related Project Slugs", name: "relatedProjects", widget: "list", required: false }
      - { label: "Related Service Slugs", name: "relatedServices", widget: "list", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Open Graph Image", name: "ogImage", widget: "image", required: false }

  # =========================================================================
  # 3. WORK & CASE STUDIES COLLECTION
  # =========================================================================
  - name: "portfolio"
    label: "Work & Case Studies"
    folder: "src/content/portfolio"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "string", required: true }
      - { label: "Short Category Label", name: "shortCategory", widget: "string", required: false }
      - { label: "Short Description", name: "shortDescription", widget: "text", required: false }
      - { label: "Full Description", name: "description", widget: "text", required: false }
      - { label: "Visual Mockup Type", name: "visualType", widget: "string", default: "brand-identity" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: true }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Date", name: "date", widget: "date", required: false }
      - { label: "Year", name: "year", widget: "string", default: "2026", required: false }
      - { label: "Client Name", name: "client", widget: "string", required: false }
      - { label: "Services Provided", name: "services", widget: "list", required: false }
      - { label: "Tools Used", name: "tools", widget: "list", required: false }
      - { label: "01 Challenge", name: "challenge", widget: "text", required: false }
      - { label: "02 Strategy / Approach", name: "strategy", widget: "text", required: false }
      - { label: "03 Design Craft", name: "design", widget: "text", required: false }
      - { label: "04 Execution", name: "execution", widget: "text", required: false }
      - { label: "05 Results & Outcomes", name: "result", widget: "text", required: false }
      - label: "Process Steps"
        name: "processSteps"
        widget: "list"
        required: false
        fields:
          - { label: "Step Number", name: "stepNumber", widget: "string" }
          - { label: "Step Title", name: "title", widget: "string" }
          - { label: "Step Description", name: "description", widget: "text" }
      - label: "Gallery Showcase"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "ID", name: "id", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Visual Type", name: "visualType", widget: "string", required: false }
          - { label: "Layout Span", name: "layout", widget: "select", options: ["large", "half"], default: "half" }
      - { label: "Related Services (slugs)", name: "relatedServices", widget: "list", required: false }
      - { label: "Related Projects (slugs)", name: "relatedProjects", widget: "list", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Open Graph Image", name: "ogImage", widget: "image", required: false }

  # =========================================================================
  # 4. BLOG ARTICLES COLLECTION
  # =========================================================================
  - name: "blog"
    label: "Blog Articles"
    folder: "src/content/blog"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Summary / Excerpt", name: "summary", widget: "text", required: true }
      - { label: "Category", name: "category", widget: "string", default: "Branding" }
      - label: "Author Info"
        name: "author"
        widget: "object"
        fields:
          - { label: "Author Name", name: "name", widget: "string", default: "Lizzdo Design Studio" }
          - { label: "Role / Title", name: "role", widget: "string", default: "Brand Strategy Lead" }
          - { label: "Bio", name: "bio", widget: "string", required: false }
          - { label: "Avatar Image", name: "avatar", widget: "image", required: false }
      - { label: "Published Date", name: "publishedDate", widget: "date", required: true }
      - { label: "Updated Date", name: "updatedDate", widget: "date", required: false }
      - { label: "Read Time", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Visual Type", name: "visualType", widget: "string", default: "brand-identity" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Key Takeaways", name: "keyTakeaways", widget: "list", required: false }
      - { label: "Article Content (Markdown)", name: "content", widget: "markdown", required: true }
      - label: "Article FAQs"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Related Services (slugs)", name: "relatedServices", widget: "list", required: false }
      - { label: "Related Projects (slugs)", name: "relatedProjects", widget: "list", required: false }
      - { label: "Related Articles (slugs)", name: "relatedArticles", widget: "list", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Open Graph Image", name: "ogImage", widget: "image", required: false }

  # =========================================================================
  # 5. TEAM MEMBERS COLLECTION
  # =========================================================================
  - name: "team"
    label: "Team Members"
    folder: "src/content/team"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "name", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Job Title / Role", name: "jobTitle", widget: "string", required: true }
      - { label: "Short Description", name: "shortDescription", widget: "text", required: true }
      - { label: "Profile Photo", name: "profilePhoto", widget: "image", required: false }
      - { label: "Photo Alt Text", name: "photoAlt", widget: "string", required: false }
      - { label: "Skills / Specialties", name: "skills", widget: "list", required: false }
      - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
      - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
      - { label: "X / Twitter URL", name: "twitter", widget: "string", required: false }
      - { label: "GitHub URL", name: "github", widget: "string", required: false }
      - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
      - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
