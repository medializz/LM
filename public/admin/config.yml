backend:
  name: github
  repo: lizzdo/media
  branch: main
  site_domain: media.lizzdo.com

# When running locally or during development:
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings & Header"
        file: "src/content/settings.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", default: "Lizzdo Media" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Creative & Digital Agency" }
          - { label: "Master Logo (SVG/Image)", name: "logo", widget: "image", default: "/uploads/lizzdo-media-logo.svg", required: false }
          - { label: "Logo for Dark Background", name: "logoDark", widget: "image", default: "/uploads/lizzdo-media-logo.svg", required: false }
          - { label: "Logo for Light Background", name: "logoLight", widget: "image", default: "/uploads/lizzdo-media-logo-light.svg", required: false }
          - { label: "Logo Mark / Icon", name: "logoMark", widget: "image", default: "/uploads/lizzdo-media-mark.svg", required: false }
          - { label: "Favicon", name: "favicon", widget: "image", default: "/uploads/lizzdo-media-mark.svg", required: false }
          - { label: "Contact Email", name: "contactEmail", widget: "string", default: "contact@media.lizzdo.com" }
          - { label: "WhatsApp / Phone", name: "whatsappNumber", widget: "string", default: "+1234567890" }
          - { label: "Header CTA Text", name: "primaryCtaText", widget: "string", default: "Let's Talk" }
          - { label: "Header CTA URL", name: "primaryCtaUrl", widget: "string", default: "/contact" }
          - { label: "Parent Company URL", name: "parentCompanyUrl", widget: "string", default: "https://lizzdo.com/" }
          - { label: "Current Domain", name: "currentDomain", widget: "string", default: "https://media.lizzdo.com/" }

      - name: "hero"
        label: "Hero Section"
        file: "src/content/hero.json"
        fields:
          - { label: "Hero Eyebrow", name: "eyebrow", widget: "string", default: "Creative & Digital Agency" }
          - { label: "Headline Line 1", name: "headlineLine1", widget: "string", default: "Design. Build." }
          - { label: "Headline Line 2 Prefix", name: "headlineLine2Prefix", widget: "string", default: "Grow. " }
          - { label: "Headline Highlighted Word", name: "headlineHighlightedWord", widget: "string", default: "Together." }
          - { label: "Hero Description", name: "description", widget: "text", default: "We help brands stand out and grow with creative design, powerful websites, and result-driven digital solutions." }
          - { label: "Primary CTA Label", name: "primaryCtaText", widget: "string", default: "Explore Our Work" }
          - { label: "Primary CTA URL", name: "primaryCtaUrl", widget: "string", default: "/work" }

  - name: "services"
    label: "Services (What We Do)"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Icon Identifier", name: "iconKey", widget: "string" }
      - { label: "Short Description", name: "shortDescription", widget: "text" }
      - { label: "Overview & Philosophy", name: "overview", widget: "markdown", required: false }
      - { label: "Deliverables Included", name: "deliverables", widget: "list", required: false }
      - { label: "Methodology & Steps", name: "methodology", widget: "list", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int" }
      - { label: "Featured", name: "featured", widget: "boolean", default: true }
      - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - label: "Frequently Asked Questions (FAQ)"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "portfolio"
    label: "Featured Work / Portfolio"
    folder: "src/content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Short Category Label", name: "shortCategory", widget: "string" }
      - { label: "Short Description", name: "shortDescription", widget: "string", required: false }
      - { label: "Project Description", name: "description", widget: "text" }
      - { label: "Hero Showcase Image", name: "heroImage", widget: "image", required: false }
      - { label: "Featured Image / Mockup", name: "image", widget: "image", required: false }
      - { label: "Visual Type Preset", name: "visualType", widget: "select", options: ["packaging-hero", "packaging-dieline", "packaging-pouch", "packaging-delivery", "packaging-hangtags", "packaging-formats", "brand-identity", "saas-dashboard", "social-campaign", "web-development"], default: "packaging-hero", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: true }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Client Name", name: "client", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "string", default: "2026", required: false }
      - { label: "Services Provided", name: "services", widget: "list", required: false }
      - { label: "Tools Used", name: "tools", widget: "list", required: false }
      - { label: "01 Challenge", name: "challenge", widget: "text", required: false }
      - { label: "02 Strategy & Approach", name: "approach", widget: "text", required: false }
      - { label: "03 Design Craft", name: "design", widget: "text", required: false }
      - { label: "04 System Deployment / Solution", name: "execution", widget: "text", required: false }
      - { label: "05 Result & Key Metrics", name: "result", widget: "text", required: false }
      - label: "Gallery Images & Visuals"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Item ID", name: "id", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Caption / Description", name: "caption", widget: "string", required: false }
          - { label: "Uploaded Image File", name: "image", widget: "image", required: false }
          - { label: "Vector Visual Preset", name: "visualType", widget: "select", options: ["packaging-hero", "packaging-dieline", "packaging-pouch", "packaging-delivery", "packaging-hangtags", "packaging-formats", "brand-identity", "saas-dashboard", "social-campaign", "web-development"], default: "packaging-hero", required: false }
          - { label: "Layout Span", name: "layout", widget: "select", options: ["large", "half"], default: "half" }
      - label: "Design Process Steps"
        name: "processSteps"
        widget: "list"
        required: false
        fields:
          - { label: "Step Number (e.g. 01)", name: "stepNumber", widget: "string" }
          - { label: "Step Title", name: "title", widget: "string" }
          - { label: "Step Description", name: "description", widget: "text" }
      - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }

  - name: "blog"
    label: "Blog & Insights"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Published Date", name: "publishedDate", widget: "date" }
      - { label: "Read Time", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Summary / Excerpt", name: "summary", widget: "text" }
      - { label: "Full Article Content (Markdown)", name: "content", widget: "markdown" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Author Details"
        name: "author"
        widget: "object"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role / Job Title", name: "role", widget: "string" }
          - { label: "Avatar Image", name: "avatar", widget: "image", required: false }
      - { label: "SEO Meta Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - label: "Article FAQs"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "process"
    label: "Our Process"
    folder: "src/content/process"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Step Number (e.g. 01)", name: "stepNumber", widget: "string" }
      - { label: "Step Title", name: "title", widget: "string" }
      - { label: "Icon Identifier", name: "iconKey", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }

  - name: "whyChooseUs"
    label: "Why Choose Us Section"
    delete: false
    editor:
      preview: false
    files:
      - name: "content"
        label: "Section Copy & CTA"
        file: "src/content/why-choose-us.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "WHY CHOOSE US" }
          - { label: "Heading Prefix", name: "headingPrefix", widget: "string", default: "Why Brands Choose " }
          - { label: "Heading Highlight", name: "headingHighlight", widget: "string", default: "Lizzdo Media" }
          - { label: "Description", name: "description", widget: "text", default: "We combine creativity, strategy, and technology to deliver exceptional results that help brands grow faster and stronger." }
          - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "Let's Work Together" }
          - { label: "CTA Button URL", name: "ctaUrl", widget: "string", default: "/contact" }

  - name: "statistics"
    label: "Statistics"
    folder: "src/content/statistics"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Value (e.g. 250+)", name: "value", widget: "string" }
      - { label: "Label (e.g. Happy Clients)", name: "label", widget: "string" }
      - { label: "Sublabel", name: "sublabel", widget: "string" }
      - { label: "Icon Identifier", name: "iconKey", widget: "string" }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Author Name", name: "author", widget: "string" }
      - { label: "Role / Position", name: "role", widget: "string" }
      - { label: "Company", name: "company", widget: "string" }
      - { label: "Avatar Image", name: "avatar", widget: "image", required: false }
